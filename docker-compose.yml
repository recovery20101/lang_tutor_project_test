services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: linguaml_api
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./hf_cache:/root/.cache/huggingface
      - ./scripts:/app/scripts
      - ./data:/app/data
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    command: bash start.sh
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    depends_on:
      db:
        condition: service_started
      chroma:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  chroma:
    image: chromadb/chroma:0.5.23
    container_name: chroma
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  db:
    image: postgres:15-alpine
    container_name: linguaml_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: linguaml_ui
    depends_on:
      api:
        condition: service_started
    environment:
      API_URL: http://api:8080/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
    name: lang_tutor_project_postgres_data
  frontend_node_modules:
    name: lang_tutor_project_frontend_node_modules
  chroma_data:
    name: lang_tutor_project_chroma_data
