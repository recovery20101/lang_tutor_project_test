# =============================================================================
#
# Поле               | Гл. где появляется
# -------------------|---------------------------------------------------
# id                 | все
# source             | все [FIXED]
# source_chapter     | все [FIXED per chapter]
# source_section     | все [REQUIRED]
# level              | все [REQUIRED]
# chunk_type         | все [REQUIRED]
