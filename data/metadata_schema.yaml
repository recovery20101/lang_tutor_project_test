# =============================================================================
# Spanish Essential Grammar — Metadata Schema Templates
# =============================================================================
# ЛЕГЕНДА ПОЛЕЙ:
#   [FIXED]    — одинаково для всех чанков, не менять
#   [REQUIRED] — обязательно, значение меняется
#   [OPTIONAL] — добавлять только когда применимо
#
# ЗНАЧЕНИЯ chunk_type:
#   rule         — основное правило с примерами
#   formation    — как образуется форма (таблицы спряжений, окончания)
#   comparison   — X vs Y (два явления в одном чанке)
#   usage_note   — уточнение, исключение, предупреждение
#   reference    — справочные таблицы, списки без правил
#   intro        — вводная секция без примеров (chunk_type=intro не индексируется отдельно)
#
# ЗНАЧЕНИЯ flags:
#   translation_trap  — поведение отличается от английского
#   common_mistake    — частая ошибка у англоговорящих
#   false_friend      — похоже на английское, значит другое
#   regional_variation — различия LA vs Peninsular
#   auxiliary_required — требует вспомогательный глагол
#   agreement_required — требует согласование рода/числа
# =============================================================================


