# subtopic           | все [REQUIRED]
# use_case           | все кроме Ch.10 (formation), Ch.23, Ch.29
# tense              | Ch.10, 11, 12, 13, 16, 19
# formation_note     | Ch.2, 6, 7, 10
# compares           | только chunk_type=comparison (Ch.11, 20, 22, 26)
# contrasts_with     | Ch.11.1.4, Ch.20.3, Ch.22.3, CMP-чанки
# flags              | везде где применимо
# related_nodes      | везде где есть cross-ref
# =============================================================================
